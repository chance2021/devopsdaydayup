apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-canary
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chance2021/devopsdaydayup/025-ArgoCDArgoRollout
    targetRevision: lab/025-argocd
    path: 025-ArgoCDArgoRollout/demo-app/canary

  destination:
    server: https://kubernetes.default.svc
    namespace: demo-canary

  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
