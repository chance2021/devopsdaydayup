apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: root
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/chance2021/devopsdaydayup.git
    targetRevision: lab/025-argocd
    path: 025-ArgoCDArgoRollout/argocd/bootstrap

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
