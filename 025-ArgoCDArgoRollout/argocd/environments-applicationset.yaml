apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-environments
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
            namespace: demo-dev
          - env: intg
            namespace: demo-intg
          - env: prod
            namespace: demo-prod
  template:
    metadata:
      name: demo-{{env}}
    spec:
      project: default
      source:
        repoURL: https://github.com/chance2021/devopsdaydayup.git
        targetRevision: lab/025-argocd
        path: demo-app/environments/{{env}}
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
